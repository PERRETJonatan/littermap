<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor — LitterMap</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-app min-h-dvh">
  <header class="flex items-center gap-3 px-5 py-3.5 bg-white border-b border-rim sticky top-0 z-[100]">
    <a href="/" class="btn btn-ghost">← Back</a>
    <h1 class="flex-1 text-xl font-bold">Monitor</h1>
    <button id="refresh-btn" class="btn">Refresh</button>
  </header>

  <main class="max-w-3xl mx-auto px-5 py-6 flex flex-col gap-5">
    <p id="loading" class="text-center text-muted py-12 text-sm">Loading…</p>
    <p id="error"   hidden class="text-center text-danger py-12 text-sm"></p>

    <div id="content" hidden class="flex flex-col gap-5">

      <!-- Disk usage bar -->
      <section class="bg-white rounded-xl border border-rim p-5 flex flex-col gap-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-semibold text-muted uppercase tracking-wider">Disk</h2>
          <span id="disk-label" class="text-sm font-semibold tabular-nums"></span>
        </div>
        <div class="h-2.5 rounded-full overflow-hidden" style="background:var(--color-rim)">
          <div id="disk-bar" class="h-full rounded-full transition-all duration-500" style="width:0%"></div>
        </div>
        <p id="disk-sub" class="text-xs text-muted tabular-nums"></p>
      </section>

      <!-- Top stat cards -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-white rounded-xl border border-rim p-4 flex flex-col gap-0.5">
          <p class="text-xs text-muted">Uploads</p>
          <p id="card-uploads-size" class="text-xl font-bold"></p>
          <p id="card-uploads-count" class="text-xs text-muted"></p>
        </div>
        <div class="bg-white rounded-xl border border-rim p-4 flex flex-col gap-0.5">
          <p class="text-xs text-muted">Thumbnails</p>
          <p id="card-thumbs-size" class="text-xl font-bold"></p>
          <p id="card-thumbs-count" class="text-xs text-muted"></p>
        </div>
        <div class="bg-white rounded-xl border border-rim p-4 flex flex-col gap-0.5">
          <p class="text-xs text-muted">Photos</p>
          <p id="card-photos" class="text-xl font-bold"></p>
          <p id="card-gps" class="text-xs text-muted"></p>
        </div>
        <div class="bg-white rounded-xl border border-rim p-4 flex flex-col gap-0.5">
          <p class="text-xs text-muted">Uptime</p>
          <p id="card-uptime" class="text-xl font-bold"></p>
          <p class="text-xs text-muted">since restart</p>
        </div>
      </div>

      <!-- Detail sections -->
      <div class="grid md:grid-cols-2 gap-4">

        <section class="bg-white rounded-xl border border-rim p-5 flex flex-col gap-3">
          <h2 class="text-xs font-semibold text-muted uppercase tracking-wider">Database</h2>
          <dl class="flex flex-col gap-2.5">
            <div class="flex justify-between text-sm">
              <dt class="text-muted">Total photos</dt>
              <dd id="db-total" class="font-medium tabular-nums"></dd>
            </div>
            <div class="flex justify-between text-sm">
              <dt class="text-muted">With GPS</dt>
              <dd id="db-gps" class="font-medium tabular-nums"></dd>
            </div>
            <div class="flex justify-between text-sm">
              <dt class="text-muted">Without GPS</dt>
              <dd id="db-nogps" class="font-medium tabular-nums"></dd>
            </div>
            <div class="flex justify-between text-sm gap-6">
              <dt class="text-muted shrink-0">Latest upload</dt>
              <dd id="db-latest" class="font-medium text-right"></dd>
            </div>
          </dl>
        </section>

        <section class="bg-white rounded-xl border border-rim p-5 flex flex-col gap-3">
          <h2 class="text-xs font-semibold text-muted uppercase tracking-wider">Server</h2>
          <dl class="flex flex-col gap-2.5">
            <div class="flex justify-between text-sm">
              <dt class="text-muted">Node.js</dt>
              <dd id="srv-node" class="font-medium font-mono"></dd>
            </div>
            <div class="flex justify-between text-sm">
              <dt class="text-muted">Heap</dt>
              <dd id="srv-heap" class="font-medium tabular-nums"></dd>
            </div>
            <div class="flex justify-between text-sm">
              <dt class="text-muted">RSS</dt>
              <dd id="srv-rss" class="font-medium tabular-nums"></dd>
            </div>
            <div class="flex justify-between text-sm">
              <dt class="text-muted">System memory</dt>
              <dd id="srv-sysmem" class="font-medium tabular-nums"></dd>
            </div>
            <div class="flex justify-between text-sm">
              <dt class="text-muted">Load (1m / 5m / 15m)</dt>
              <dd id="srv-load" class="font-medium font-mono tabular-nums"></dd>
            </div>
            <div class="flex justify-between text-sm">
              <dt class="text-muted">Platform</dt>
              <dd id="srv-platform" class="font-medium font-mono"></dd>
            </div>
          </dl>
        </section>

      </div>

      <p id="updated-at" class="text-center text-xs text-muted"></p>
    </div>
  </main>

  <script>
    fetch('/api/me').then(r => r.json()).then(d => {
      if (!d.admin) window.location.replace('/login.html?next=/monitor.html');
    });

    function fmtBytes(b) {
      if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
      if (b >= 1048576)    return (b / 1048576).toFixed(1) + ' MB';
      if (b >= 1024)       return Math.round(b / 1024) + ' KB';
      return b + ' B';
    }

    function fmtUptime(s) {
      s = Math.floor(s);
      const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
      if (d > 0) return `${d}d ${h}h`;
      if (h > 0) return `${h}h ${m}m`;
      return `${m}m ${s % 60}s`;
    }

    function fmtRelative(iso) {
      if (!iso) return 'Never';
      const s = (Date.now() - new Date(iso + 'Z')) / 1000;
      if (s < 60)          return 'Just now';
      if (s < 3600)        return `${Math.floor(s / 60)}m ago`;
      if (s < 86400)       return `${Math.floor(s / 3600)}h ago`;
      if (s < 86400 * 30)  return `${Math.floor(s / 86400)}d ago`;
      return new Date(iso + 'Z').toLocaleDateString();
    }

    async function load() {
      document.getElementById('loading').hidden = false;
      document.getElementById('content').hidden = true;
      document.getElementById('error').hidden = true;

      try {
        const d = await fetch('/api/monitor').then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        });

        // Disk bar
        if (d.disk) {
          const pct = Math.round(d.disk.used / d.disk.total * 100);
          const bar = document.getElementById('disk-bar');
          bar.style.width = pct + '%';
          bar.style.background = pct > 85 ? 'var(--color-danger)' : pct > 70 ? '#f59e0b' : 'var(--color-accent)';
          document.getElementById('disk-label').textContent = `${pct}% used`;
          document.getElementById('disk-sub').textContent =
            `${fmtBytes(d.disk.used)} used · ${fmtBytes(d.disk.free)} free · ${fmtBytes(d.disk.total)} total`;
        }

        // Stat cards
        document.getElementById('card-uploads-size').textContent  = fmtBytes(d.uploads.size);
        document.getElementById('card-uploads-count').textContent = `${d.uploads.count} file${d.uploads.count !== 1 ? 's' : ''}`;
        document.getElementById('card-thumbs-size').textContent   = fmtBytes(d.thumbs.size);
        document.getElementById('card-thumbs-count').textContent  = `${d.thumbs.count} file${d.thumbs.count !== 1 ? 's' : ''}`;
        document.getElementById('card-photos').textContent        = d.database.total;
        document.getElementById('card-gps').textContent           = `${d.database.withGps} with GPS`;
        document.getElementById('card-uptime').textContent        = fmtUptime(d.uptime);

        // Database
        const total = d.database.total;
        document.getElementById('db-total').textContent  = total;
        document.getElementById('db-gps').textContent    = `${d.database.withGps}${total > 0 ? ` (${Math.round(d.database.withGps / total * 100)}%)` : ''}`;
        document.getElementById('db-nogps').textContent  = total - d.database.withGps;
        document.getElementById('db-latest').textContent = fmtRelative(d.database.latestUpload);

        // Server
        const sysUsedPct = Math.round((1 - d.systemMemory.free / d.systemMemory.total) * 100);
        document.getElementById('srv-node').textContent     = d.nodeVersion;
        document.getElementById('srv-heap').textContent     = `${fmtBytes(d.memory.heapUsed)} / ${fmtBytes(d.memory.heapTotal)}`;
        document.getElementById('srv-rss').textContent      = fmtBytes(d.memory.rss);
        document.getElementById('srv-sysmem').textContent   = `${sysUsedPct}% · ${fmtBytes(d.systemMemory.total)} total`;
        document.getElementById('srv-load').textContent     = d.loadAvg.map(n => n.toFixed(2)).join(' / ');
        document.getElementById('srv-platform').textContent = d.platform;

        document.getElementById('updated-at').textContent = `Last updated at ${new Date().toLocaleTimeString()}`;
        document.getElementById('loading').hidden = true;
        document.getElementById('content').hidden = false;
      } catch (err) {
        document.getElementById('loading').hidden = true;
        document.getElementById('error').textContent = `Failed to load: ${err.message}`;
        document.getElementById('error').hidden = false;
      }
    }

    document.getElementById('refresh-btn').addEventListener('click', load);
    load();
  </script>
</body>
</html>
